limit_req_zone $binary_remote_addr zone=yakoot_files:10m rate=20r/s;
server_tokens off;

server {
	listen 8080 default_server;
	server_name 217.55.171.129 _;

	client_max_body_size 50M;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

	location /.well-known/acme-challenge/ {
		root /Users/safty/Work/motech/yakoot/certbot-webroot;
	}

	location ^~ /api/files/ {
		limit_except GET {
			deny all;
		}
		limit_req zone=yakoot_files burst=40 nodelay;
		proxy_pass http://127.0.0.1:8091;
		proxy_http_version 1.1;
		proxy_buffering off;
		proxy_read_timeout 3600s;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location ^~ /api/ {
		return 404;
	}

	location = /cms { return 404; }
	location ^~ /cms/ { return 404; }
	location = /_/ {
		return 404;
	}
	location ^~ /_/ { return 404; }

	location / {
		root /Users/safty/Work/motech/yakoot/dist;
		limit_except GET {
			deny all;
		}
		try_files $uri $uri/ /index.html;
	}
}

server {
	listen 100.120.48.75:8092;
	server_name _;

	client_max_body_size 50M;

	location = / {
		return 302 /cms/;
	}

	location = /cms {
		return 301 /cms/;
	}

	location ^~ /cms/ {
		rewrite ^/cms/(.*)$ /_/$1 break;
		proxy_pass http://127.0.0.1:8091;
		proxy_http_version 1.1;
		proxy_buffering off;
		proxy_read_timeout 3600s;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /api/ {
		proxy_pass http://127.0.0.1:8091;
		proxy_http_version 1.1;
		proxy_buffering off;
		proxy_read_timeout 3600s;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
